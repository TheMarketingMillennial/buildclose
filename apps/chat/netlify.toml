# BuildClose — chat origin (chat.buildclose.app)
#
# This is a SEPARATE ORIGIN from the dashboard (app.buildclose.app) by design
# (requirement 3). A proposal page loads the widget, the widget loads this app in
# a sandboxed iframe, and neither the host page nor the dashboard can read the
# conversation or the in-memory session token.
#
# Deploy:  netlify deploy --prod --dir apps/chat   (site: buildclose-chat)

[build]
  publish = "apps/chat"

# Netlify reads apps/chat/_headers for the CSP / frame-ancestors policy. It is
# kept beside the app rather than in this file because `frame-ancestors` must be
# expressed in the Content-Security-Policy header.

[[redirects]]
  from = "/embed"
  to = "/embed/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/embed/index.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Deliberately no X-Frame-Options: the whole product is being framed. The
    # CSP frame-ancestors directive is the precise control, and it is set in
    # _headers so it can differ per path (/embed vs everything else).
